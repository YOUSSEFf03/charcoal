name: farah-charcoal
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - production_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dbnet]

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ${PROD_ENV_FILE:-/opt/farah-charcoal/.env.production}
    environment:
      NODE_ENV: production
      DEV_AUTH_BYPASS_ENABLED: "false"
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    expose: ["3001"]
    networks: [appnet, dbnet]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>r.json()).then(x=>{if(x.database!=='connected')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [backend]
    networks: [appnet]

  webhook-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./nginx/webhook.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [appnet]

networks:
  appnet:
  dbnet:
    internal: true

volumes:
  production_pgdata:
